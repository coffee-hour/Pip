<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pip-Beast · 3D Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');
  html, body { margin: 0; height: 100%; background: #000; color: #ffb000; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
  #hud { position: fixed; top: 16px; left: 16px; font-size: 12px; line-height: 1.6; pointer-events: none; }
  #hud h1 { font-size: 14px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.12em; text-transform: uppercase; }
  #hud .dim { color: #7a5600; }
  #panel { position: fixed; bottom: 16px; left: 16px; right: 16px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 12px; pointer-events: none; }
  #info { position: fixed; top: 16px; right: 16px; font-size: 12px; text-align: right; line-height: 1.6; pointer-events: none; }
  #controls { position: fixed; bottom: 16px; right: 16px; display: flex; gap: 8px; }
  button { background: #000; color: #ffb000; border: 1px solid #ffb000; font-family: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
  button:hover, button.on { background: #ffb000; color: #000; }
  #tip { position: fixed; pointer-events: none; background: #000; border: 1px solid #ffb000; padding: 6px 8px; font-size: 11px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="hud">
  <h1>Pip-Beast</h1>
  <div>decoder-only transformer · pre-LN · weight-tied</div>
  <div class="dim">drag to orbit · scroll to zoom · hover a block</div>
</div>
<div id="info">
  <div>22 layers · 16 heads · head_dim 128</div>
  <div>width 2048 · FFN 8192 (GELU) · context 512</div>
  <div>vocab 2048 · ~1.11B parameters</div>
</div>
<div id="panel"></div>
<div id="controls">
  <button id="btnFlow" class="on">flow</button>
  <button id="btnHeads">heads</button>
  <button id="btnReset">reset</button>
</div>
<div id="tip"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Config (mirrors model.py PipConfig defaults for Pip-Beast) ----
const CFG = { vocab: 2048, ctx: 512, layers: 22, heads: 16, width: 2048, ffn: 4 * 2048 };
const HEAD_DIM = CFG.width / CFG.heads; // 128

const AMBER = 0xffb000;
const AMBER_DIM = 0x7a5600;
const BLACK = 0x000000;

// ---- Renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BLACK);
scene.fog = new THREE.FogExp2(BLACK, 0.035);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
const HOME = new THREE.Vector3(0, 6, 34);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const key = new THREE.PointLight(AMBER, 2.2, 200);
key.position.set(12, 18, 20);
scene.add(key);

// ---- Layout ----
// Each transformer block is a column along X. Inside a block: LN -> attention (16 head slabs) -> LN -> MLP.
const SPACING = 1.6;
const X0 = -((CFG.layers + 1) * SPACING) / 2;
const interactive = [];
const flowParticles = [];
let showHeads = false;
let showFlow = true;

const edgeMat = new THREE.LineBasicMaterial({ color: AMBER, transparent: true, opacity: 0.18 });
const frameMat = new THREE.LineBasicMaterial({ color: AMBER_DIM, transparent: true, opacity: 0.6 });

function box(w, h, d, color, opacity = 1) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity });
  return new THREE.Mesh(geo, mat);
}
function wire(geo) {
  return new THREE.LineSegments(new THREE.EdgesGeometry(geo), frameMat);
}

// Token + positional embedding (input)
function makeEmbedding(x) {
  const g = new THREE.Group();
  const m = box(1.1, 4.2, 1.1, AMBER, 0.85);
  g.add(m, wire(m.geometry));
  g.position.set(x, 0, 0);
  g.userData = { label: `Embedding  tok 2048×2048 + pos 512×2048  (tied with lm_head)` };
  return g;
}

// Final LayerNorm + LM head (output)
function makeHead(x) {
  const g = new THREE.Group();
  const m = box(1.1, 4.2, 1.1, AMBER, 0.85);
  g.add(m, wire(m.geometry));
  g.position.set(x, 0, 0);
  g.userData = { label: 'ln_f → lm_head (2048 logits, weight-tied)' };
  return g;
}

// One transformer block
function makeBlock(idx, x) {
  const g = new THREE.Group();
  g.position.set(x, 0, 0);

  // Attention: 16 head slabs stacked in a ring
  const attn = new THREE.Group();
  attn.name = 'attn';
  for (let h = 0; h < CFG.heads; h++) {
    const ang = (h / CFG.heads) * Math.PI * 2;
    const slab = box(0.22, 1.3, 0.5, AMBER, 0.55);
    slab.position.set(Math.cos(ang) * 0.75, 0, Math.sin(ang) * 0.75);
    slab.rotation.y = -ang;
    slab.userData = { head: h, block: idx, kind: 'head' };
    attn.add(slab);
    interactive.push(slab);
  }
  g.add(attn);

  // MLP: wide slab (2048 -> 8192 -> 2048)
  const mlp = box(0.9, 2.2, 1.9, AMBER_DIM, 0.6);
  mlp.position.set(0, -2.4, 0);
  mlp.userData = { block: idx, kind: 'mlp' };
  mlp.name = 'mlp';
  g.add(mlp, wire(mlp.geometry));
  interactive.push(mlp);

  // Residual stream spine
  const spine = box(0.08, 0.08, 4.6, AMBER, 0.9);
  spine.position.set(0, 2.9, 0);
  g.add(spine);

  g.userData = { label: `Block ${idx + 1}/22  ·  LN → MHA (16 heads × 128) → +res → LN → MLP (2048→8192→2048)`, block: idx };
  return g;
}

const blocks = [];
const embed = makeEmbedding(X0);
scene.add(embed);
interactive.push(embed);

for (let i = 0; i < CFG.layers; i++) {
  const b = makeBlock(i, X0 + (i + 1) * SPACING);
  blocks.push(b);
  scene.add(b);
}

const head = makeHead(X0 + (CFG.layers + 1) * SPACING);
scene.add(head);
interactive.push(head);

// Residual-stream connections between consecutive stages
const streamPts = [];
const stages = [embed, ...blocks, head];
for (let i = 0; i < stages.length - 1; i++) {
  streamPts.push(stages[i].position.clone().setY(2.9), stages[i + 1].position.clone().setY(2.9));
}
const streamGeo = new THREE.BufferGeometry().setFromPoints(streamPts);
scene.add(new THREE.LineSegments(streamGeo, edgeMat));

// Flow particles along the residual stream (token moving through the network)
const PARTICLES = 60;
const pGeo = new THREE.SphereGeometry(0.09, 8, 8);
const pMat = new THREE.MeshBasicMaterial({ color: AMBER });
const startX = X0, endX = X0 + (CFG.layers + 1) * SPACING;
for (let i = 0; i < PARTICLES; i++) {
  const p = new THREE.Mesh(pGeo, pMat);
  p.userData.t = Math.random();
  p.userData.speed = 0.08 + Math.random() * 0.05;
  scene.add(p);
  flowParticles.push(p);
}

// Ground grid, charcoal
const grid = new THREE.GridHelper(120, 60, 0x1a1a1a, 0x111111);
grid.position.y = -5.5;
scene.add(grid);

// ---- Interaction ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-9, -9);
const tip = document.getElementById('tip');
window.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  tip.style.left = e.clientX + 14 + 'px';
  tip.style.top = e.clientY + 14 + 'px';
});

let hovered = null;
function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(interactive, false)[0];
  const obj = hit ? hit.object : null;
  let label = null;
  if (obj) {
    if (obj.userData.kind === 'head') label = `Block ${obj.userData.block + 1} · head ${obj.userData.head + 1}/16 · head_dim 128`;
    else if (obj.userData.kind === 'mlp') label = `Block ${obj.userData.block + 1} · MLP 2048 → 8192 → 2048 (GELU)`;
    else if (obj.parent && obj.parent.userData.label) label = obj.parent.userData.label;
    else if (obj.userData.label) label = obj.userData.label;
  }
  if (label) { tip.textContent = label; tip.style.display = 'block'; } else { tip.style.display = 'none'; }
  hovered = obj;
  renderer.domElement.style.cursor = obj ? 'pointer' : 'default';
  // highlight hovered head/mlp
  for (const m of interactive) if (m.material && m.material.opacity !== undefined && m.userData.kind) {
    m.material.opacity = m === obj ? 1 : (m.userData.kind === 'head' ? 0.55 : 0.6);
  }
}

const panel = document.getElementById('panel');
const stats = [
  ['params', '~1.11B'],
  ['layers', CFG.layers],
  ['heads', `${CFG.heads} × ${HEAD_DIM}`],
  ['width', CFG.width],
  ['ffn', CFG.ffn],
  ['context', CFG.ctx],
  ['vocab', CFG.vocab],
];
panel.innerHTML = stats.map(([k, v]) => `<div><span class="dim">${k}</span> ${v}</div>`).join('');

// ---- Buttons ----
const btnFlow = document.getElementById('btnFlow');
const btnHeads = document.getElementById('btnHeads');
document.getElementById('btnReset').onclick = () => { camera.position.copy(HOME); controls.target.set(0, 0, 0); };
btnFlow.onclick = () => { showFlow = !showFlow; btnFlow.classList.toggle('on', showFlow); flowParticles.forEach(p => p.visible = showFlow); };
btnHeads.onclick = () => { showHeads = !showHeads; btnHeads.classList.toggle('on', showHeads); };

// Head emphasis: when toggled, heads spin slightly around their block axis

// ---- Animation ----
const clock = new THREE.Clock();
let t0 = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t0 += dt;

  // flow particles travel left -> right along the residual stream
  for (const p of flowParticles) {
    p.userData.t += dt * p.userData.speed * 0.25;
    if (p.userData.t > 1) p.userData.t -= 1;
    p.position.set(startX + (endX - startX) * p.userData.t, 2.9, 0);
  }

  // heads gently breathe when toggled
  if (showHeads) {
    blocks.forEach((b, i) => {
      b.children[0].rotation.y = Math.sin(t0 * 0.8 + i * 0.3) * 0.25;
    });
  } else {
    blocks.forEach(b => { b.children[0].rotation.y = 0; });
  }

  updateHover();
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
